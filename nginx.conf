# ── Logging ────────────────────────────────────────────────────────────────
# Custom log format with forwarded IP (for reverse proxy) + request details
log_format detailed '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time';

access_log /dev/stdout detailed;
error_log /dev/stderr;

server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;

    # Allow larger uploads (GPX files)
    client_max_body_size 16M;

    # Trust X-Forwarded-For from upstream proxy (NPM)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Security: deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: deny access to src/
    location ~ ^/src/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static assets
    location /css/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Static assets
    location /js/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Front controller: everything to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
        fastcgi_buffers 8 128k;
        fastcgi_buffer_size 256k;
    }
}
